name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ledquill
          POSTGRES_PASSWORD: ledquill
          POSTGRES_DB: ledquill
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ledquill -d ledquill"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      LEDQUILL_ENV: test
      DATABASE_URL: postgresql+psycopg://ledquill:ledquill@localhost:5432/ledquill
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install Tesseract (the OCR tests need the engine; the Docker image has it)
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr
          tesseract --version
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: alembic upgrade head
      - run: alembic check
      - run: pytest
